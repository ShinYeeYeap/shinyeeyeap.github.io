<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elementra Travel | Home</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <!-- HEADER -->

    <main>

        <!-- HOME HERO -->
        <section class="home_hero">

            <!-- Two title lines -->
            <div class="home_hero_heading">
                <p class="home_hero_small">Explore</p>
                <h1 class="home_hero_title">New Horizons</h1>
            </div>

            <!-- Intro n two img -->
            <div class="home_hero_content">

                <div class="home_hero_intro">

                    <!-- Down arrow -->

                    <p class="home_hero_description">
                        Explore new horizons, discover hidden gems,
                        embrace adventure, create memories,
                        connect with cultures
                    </p>

                    <!-- LEARN MORE -->
                    <a href="#" class="btn home_hero_button">Learn More</a>

                </div>

                <div class="home_hero_main_image">
                    <img src="img/Home Page 1.jpg" alt="Green mountains and a winding road">
                </div>

                <div class="home_hero_side_image">
                    <img src="img/Home Page 2.jpg" alt="Friends walking together on a beach">
                </div>

            </div>

        </section>

        <!-- HOME STATISTICS -->
        <section class="home_statistics">

            <div class="home_statistics_item">
                <p class="home_statistics_number">8</p>
                <p class="home_statistics_name">Routes</p>
            </div>

            <div class="home_statistics_item">
                <p class="home_statistics_number">23</p>
                <p class="home_statistics_name">Guides</p>
            </div>

            <div class="home_statistics_item">
                <p class="home_statistics_number">16</p>
                <p class="home_statistics_name">Packages</p>
            </div>

            <div class="home_statistics_item">
                <p class="home_statistics_number">31</p>
                <p class="home_statistics_name">Goals</p>
            </div>

        </section>

    </main>

    <!-- FOOTER -->

</body>

</html>
